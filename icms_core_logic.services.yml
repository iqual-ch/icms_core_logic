services:
  icms_core_logic.commands:
    class: Drupal\icms_core_logic\Drush\Commands\IcmsCoreLogicCommands
    arguments:
      - '@file_system'
      - '@module_handler'
      - '@entity_type.manager'
      - '@language_manager'
      - '@language.default'
      - '@string_translation'
    tags:
      - { name: drush.command }
  icms_core_logic.backend_domain:
    class: Drupal\icms_core_logic\BackendDomain
    arguments: ['@settings']
  icms_core_logic.backend_domain_subscriber:
    class: Drupal\icms_core_logic\EventSubscriber\BackendDomainSubscriber
    arguments: ['@icms_core_logic.backend_domain', '@current_route_match', '@icms_core_logic.site_shell']
    tags:
      - { name: event_subscriber }
  icms_core_logic.backend_domain_config_override:
    class: Drupal\icms_core_logic\Config\BackendDomainConfigOverride
    arguments: ['@icms_core_logic.backend_domain', '@request_stack']
    tags:
      - { name: config.factory.override, priority: 50 }
  icms_core_logic.site_shell:
    class: Drupal\icms_core_logic\SiteShell
    arguments: ['@icms_core_logic.backend_domain', '@current_user', '@config.factory']
  icms_core_logic.site_shell_exception_subscriber:
    class: Drupal\icms_core_logic\EventSubscriber\SiteShellExceptionSubscriber
    arguments: ['@icms_core_logic.site_shell', '@http_kernel']
    tags:
      - { name: event_subscriber }
  icms_core_logic.blokkli_editor:
    class: Drupal\icms_core_logic\BlokkliEditor
    arguments: ['@paragraphs_blokkli.config', '@icms_core_logic.backend_domain', '@entity.repository', '@current_user', '@request_stack']
  icms_core_logic.update_config_installer:
    class: Drupal\icms_core_logic\UpdateConfigInstaller
    arguments: ['@module_installer', '@module_handler', '@extension.list.module', '@config.installer', '@config.manager', '@entity_type.manager', '@config.storage', '@config.storage.sync', '@config.import_transformer', '@Drupal\Core\Config\ConfigImporterFactory', '@logger.factory', '@lock.persistent', '@event_dispatcher', '@config.typed']
